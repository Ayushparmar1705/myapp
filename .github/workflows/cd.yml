name: CD - Deploy to EC2

on:
  workflow_run:
    workflows:
      - "CI - Build and Push Docker Image"
    types:
      - completed
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Docker Image to EC2

    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp
          TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE,TAG
          script: |
            set -eu

            echo "Logging in to Docker Hub..."
            echo "$DOCKER_PASSWORD" | sudo docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            echo "Pulling Docker image: $IMAGE:$TAG"
            sudo docker pull "$IMAGE:$TAG"

            echo "Removing old application container..."
            sudo docker rm -f myapp 2>/dev/null || true

            echo "Starting the new application container..."
            sudo docker run -d \
              --restart unless-stopped \
              --name myapp \
              -p 8080:80 \
              "$IMAGE:$TAG"

            echo "Removing unused Docker images..."
            sudo docker image prune -f

            echo "Deployment completed successfully."

            sudo docker logout
