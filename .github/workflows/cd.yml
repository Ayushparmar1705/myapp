name: CD - Deploy to EC2

on:
  workflow_run:
    workflows:
      - "CI - Build & Push Docker Image"
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy Docker Image to EC2

    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/myapp
          TAG: ${{ github.event.workflow_run.head_sha }}

        with:
          host: ${{ secrets.HOST_DNS }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD,IMAGE,TAG

          script: |
            set -eu

            # Install Docker and Apache if needed
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y docker.io
            fi

            if ! command -v apache2 >/dev/null 2>&1; then
              sudo apt-get update -y
              sudo apt-get install -y apache2
            fi

            # Enable required services
            sudo systemctl enable --now docker
            sudo systemctl enable --now apache2

            # Login to Docker Hub
            echo "$DOCKER_PASSWORD" | sudo docker login \
              --username "$DOCKER_USERNAME" \
              --password-stdin

            # Pull the image created by CI
            echo "Pulling image: $IMAGE:$TAG"
            sudo docker pull "$IMAGE:$TAG"

            # Remove the old container
            sudo docker rm -f myapp 2>/dev/null || true

            # Run the updated application
            sudo docker run -d \
              --restart unless-stopped \
              --name myapp \
              -p 8080:80 \
              "$IMAGE:$TAG"

            # Restart Apache
            sudo systemctl restart apache2

            # Verify the container
            sudo docker ps --filter "name=myapp"

            # Logout from Docker Hub
            sudo docker logout

            echo "Deployment completed successfully."
